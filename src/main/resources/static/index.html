<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
    <div class="container my-5">
        <h1 class="text-center mb-4">Product Management System</h1>

        <!-- Products Sorted by Price -->
        <div class="card mb-4">
            <div class="card-header">
                <h2>Products (Sorted by Price)</h2>
            </div>
            <div class="card-body">
                <button class="btn btn-primary mb-3" onclick="fetchProductsByPrice()">Load Products</button>
                <table class="table table-striped" id="productTable">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Title</th>
                            <th>Price</th>
                            <th>Quantity</th>
                            <th>Description</th>
                            <th>User</th>
                            <th>Categories</th>
                        </tr>
                    </thead>
                    <tbody id="productTableBody"></tbody>
                </table>
            </div>
        </div>

        <!-- Products by Category -->
        <div class="card mb-4">
            <div class="card-header">
                <h2>Products by Category</h2>
            </div>
            <div class="card-body">
                <div class="input-group mb-3">
                    <input type="number" class="form-control" id="categoryIdInput" placeholder="Enter Category ID">
                    <button class="btn btn-primary" onclick="fetchProductsByCategory()">Search</button>
                </div>
                <table class="table table-striped" id="categoryProductTable">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Title</th>
                            <th>Price</th>
                            <th>Quantity</th>
                            <th>Description</th>
                            <th>User</th>
                        </tr>
                    </thead>
                    <tbody id="categoryProductTableBody"></tbody>
                </table>
            </div>
        </div>

        <!-- CRUD Forms -->
        <div class="row">
            <!-- Create User -->
            <div class="col-md-4">
                <div class="card mb-4">
                    <div class="card-header">
                        <h3>Create User</h3>
                    </div>
                    <div class="card-body">
                        <form id="createUserForm">
                            <div class="mb-3">
                                <label for="userFullname" class="form-label">Fullname</label>
                                <input type="text" class="form-control" id="userFullname" required>
                            </div>
                            <div class="mb-3">
                                <label for="userEmail" class="form-label">Email</label>
                                <input type="email" class="form-control" id="userEmail" required>
                            </div>
                            <div class="mb-3">
                                <label for="userPassword" class="form-label">Password</label>
                                <input type="password" class="form-control" id="userPassword" required>
                            </div>
                            <div class="mb-3">
                                <label for="userPhone" class="form-label">Phone</label>
                                <input type="text" class="form-control" id="userPhone">
                            </div>
                            <button type="submit" class="btn btn-success">Create User</button>
                        </form>
                    </div>
                </div>
            </div>

            <!-- Create Product -->
            <div class="col-md-4">
                <div class="card mb-4">
                    <div class="card-header">
                        <h3>Create Product</h3>
                    </div>
                    <div class="card-body">
                        <form id="createProductForm">
                            <div class="mb-3">
                                <label for="productTitle" class="form-label">Title</label>
                                <input type="text" class="form-control" id="productTitle" required>
                            </div>
                            <div class="mb-3">
                                <label for="productQuantity" class="form-label">Quantity</label>
                                <input type="number" class="form-control" id="productQuantity" required>
                            </div>
                            <div class="mb-3">
                                <label for="productDesc" class="form-label">Description</label>
                                <input type="text" class="form-control" id="productDesc">
                            </div>
                            <div class="mb-3">
                                <label for="productPrice" class="form-label">Price</label>
                                <input type="number" step="0.01" class="form-control" id="productPrice" required>
                            </div>
                            <div class="mb-3">
                                <label for="productUserId" class="form-label">User ID</label>
                                <input type="number" class="form-control" id="productUserId" required>
                            </div>
                            <div class="mb-3">
                                <label for="productCategoryIds" class="form-label">Category IDs (comma-separated)</label>
                                <input type="text" class="form-control" id="productCategoryIds">
                            </div>
                            <button type="submit" class="btn btn-success">Create Product</button>
                        </form>
                    </div>
                </div>
            </div>

            <!-- Create Category -->
            <div class="col-md-4">
                <div class="card mb-4">
                    <div class="card-header">
                        <h3>Create Category</h3>
                    </div>
                    <div class="card-body">
                        <form id="createCategoryForm">
                            <div class="mb-3">
                                <label for="categoryName" class="form-label">Name</label>
                                <input type="text" class="form-control" id="categoryName" required>
                            </div>
                            <div class="mb-3">
                                <label for="categoryImages" class="form-label">Image URL</label>
                                <input type="text" class="form-control" id="categoryImages">
                            </div>
                            <button type="submit" class="btn btn-success">Create Category</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/app.js}"></script>
</body>
</html>
